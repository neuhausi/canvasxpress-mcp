<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanvasXpress Dashboard View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; }
    /* A dashboard is a grid of panels that can be taller than the iframe, so
       (unlike the single-chart view) the body scrolls rather than clipping. */
    body {
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--cx-chrome-bg, #ffffff);
      color: var(--cx-chrome-fg, #111827);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #cx-dashboard { width: 100%; }
    /* Compact filter search boxes (the bundle's default is a 32px field). */
    #cx-dashboard .cxd-filters input.cX-DataFilter-Search { height: 24px; font-size: 12px; padding: 0 0 0 6px; margin-bottom: 3px; }
    #cx-dashboard .cxd-filters input.cxd-filters-find { margin-bottom: 6px; }
    #cx-toolbar { background: var(--cx-chrome-bg, #ffffff); color: var(--cx-chrome-fg, #111827); display: none; align-items: center; justify-content: flex-end; gap: 8px; padding: 4px 8px 0; }
    #cx-status { font-size: 12px; opacity: .8; margin-right: auto; }
    #cx-status.err { color: #b91c1c; opacity: 1; }
    .cx-btn {
      font: inherit; font-size: 12px; color: inherit; background: transparent; opacity: .85;
      border: 1px solid currentColor; border-radius: 4px; padding: 2px 10px; cursor: pointer;
    }
    .cx-btn:hover:not(:disabled) { opacity: 1; }
    .cx-btn:disabled { opacity: .4; cursor: default; }
    /* Insights: what stands out in the COMPLETE data, computed in this page. */
    #cx-insights { display: none; margin: 6px 8px 0; padding: 6px 10px 7px; border: 1px solid currentColor; border-radius: 6px; font-size: 12px; }
    #cx-insights.on { display: block; }
    #cx-insights .ttl { font-weight: 600; margin-bottom: 3px; }
    #cx-insights .ttl span { font-weight: 400; opacity: .7; margin-left: 6px; }
    #cx-insights ul { margin: 0; padding-left: 16px; }
    #cx-insights li { margin: 1px 0; }
    #cx-json { display: none; padding: 6px 8px 0; }
    #cx-json textarea {
      width: 100%; height: 150px; box-sizing: border-box; font: 11px monospace;
      background: var(--cx-chrome-bg, #fff); color: var(--cx-chrome-fg, #111); border: 1px solid currentColor; border-radius: 4px;
    }
    #cx-json .row { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 12px; }
    /* The drop zone fills the panel edge to edge (no page colour showing around it) and follows
       the host's colour scheme like the rest of the chrome. */
    #cx-drop {
      display: none; width: 100%; min-height: 180px; padding: 40px 20px; text-align: center; cursor: pointer;
      font: 15px system-ui, sans-serif; color: inherit; background: var(--cx-chrome-bg, #ffffff);
      outline: 2px dashed currentColor; outline-offset: -10px; opacity: .92;
    }
    #cx-drop.on { display: block; }
    #cx-drop.over { outline-color: #2563eb; opacity: 1; }
    #cx-drop b { display: block; font-size: 20px; margin-bottom: 6px; }
    #cx-drop small { display: block; margin-top: 8px; opacity: .7; }
    #cx-drop.busy { cursor: progress; opacity: .6; }
    body.cx-dark { --cx-chrome-bg: #1f2937; --cx-chrome-fg: #e5e7eb; }
    #cx-error {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #fee2e2;
      color: #b91c1c;
      font-family: monospace;
      font-size: 13px;
      padding: 12px 16px;
      border-bottom: 1px solid #fca5a5;
      z-index: 9999;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
  <!--
    The canonical canvasxpress-dashboards drop-in: the CanvasXpress engine CSS +
    JS, then the dashboards UMD bundle. Both are served from
    https://www.canvasxpress.org, so a single origin covers the MCP Apps CSP
    (resourceDomains). The dashboards global is `CanvasXpressDashboards`; it needs
    the `CanvasXpress` global, hence the load order.
    Per MCP Apps spec §UI Resource Format: resourceDomains must include
    "https://www.canvasxpress.org" when the host enforces CSP.
  -->
  <link href="https://www.canvasxpress.org/dist/canvasXpress.css" rel="stylesheet" />
  <script src="https://www.canvasxpress.org/dist/canvasXpress.min.js"></script>
  <script src="https://www.canvasxpress.org/dashboards/canvasxpress-dashboards.umd.js"></script>
</head>
<body>
  <div id="cx-error"></div>
  <div id="cx-build" style="position:fixed;right:6px;bottom:2px;font:10px monospace;opacity:.5;z-index:9000">canvasxpress-mcp view __CX_VIEW_BUILD__</div>
  <div id="cx-wait" style="font:13px sans-serif;opacity:.7;padding:12px">CanvasXpress dashboard view loaded. Waiting for the host to send the dashboard...</div>
  <div id="cx-drop" role="button" tabindex="0" aria-label="Drag your data file here">
    <b>Drag your file here</b>
    <span>CSV or TSV: the complete file, straight to the dashboard (or click to choose it)</span>
    <small id="cx-drop-note">Drop 2 to 6 related files together to build one dashboard from all of them.</small>
    <input id="cx-drop-input" type="file" multiple accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain" style="display:none">
  </div>
  <div id="cx-toolbar">
    <span id="cx-status"></span>
    <button id="cx-save" class="cx-btn" type="button">Save</button>
    <button id="cx-builder" class="cx-btn" type="button">Open in Builder</button>
  </div>
  <div id="cx-insights" role="region" aria-label="What stands out"></div>
  <div id="cx-json">
    <textarea id="cx-json-text" readonly spellcheck="false"></textarea>
    <div class="row"><button id="cx-json-copy" class="cx-btn" type="button">Copy JSON</button>
      <button id="cx-json-close" class="cx-btn" type="button">Close</button>
      <span id="cx-json-note"></span></div>
  </div>
  <div id="cx-dashboard"></div>

  <script>
    // ---------------------------------------------------------------------------
    // MCP Apps protocol implementation (dashboard view).
    // Per MCP Apps spec §Communication Protocol (2026-01-26):
    //   - View sends ui/initialize request to window.parent via postMessage
    //   - Host sends ui/notifications/tool-result notification with CallToolResult
    //   - Spec §Transport Layer: postMessage target origin is '*'
    // Modelled on cx_chart_view.html; the difference is that the payload carries a
    // full dashboard `spec` rendered with CanvasXpressDashboards.renderDashboard()
    // (a grid of linked panels) instead of a single {data, config} chart.
    // ---------------------------------------------------------------------------

    let handle = null;         // { close } from renderDashboard (live-source teardown)
    let lastSpec = null;       // last spec drawn, for a resize re-render
    let lastWidth = 0;         // last viewport width a render was done at
    let resizeTimer = null;
    let nextId = 1;
    let hostColorScheme = null;   // 'dark' | 'light' from the host's ui/initialize result, when it says

    /** Show a visible error banner (not just console.error). */
    function showError(msg) {
      const el = document.getElementById('cx-error');
      el.textContent = 'CanvasXpress Dashboards error: ' + msg;
      el.style.display = 'block';
      console.error('[cx-dashboard-view]', msg);
    }

    /**
     * A tool call that produced no dashboard (declined template, bad input, tool error).
     * The agent usually retries with better arguments, so no red banner: clear any old
     * banner, drop the waiting line (the view collapses) and log the reason to the console.
     */
    function skipResult(msg) {
      clearError();
      const wait = document.getElementById('cx-wait'); if (wait) wait.remove();
      console.warn('[cx-dashboard-view] no dashboard:', msg);
      // One quiet line on screen, never a blank panel.
      const el = document.getElementById('cx-error');
      el.textContent = 'No dashboard: ' + msg;
      el.style.display = 'block';
    }

    /** Clear a prior error banner. */
    function clearError() {
      const el = document.getElementById('cx-error');
      if (el) el.style.display = 'none';
    }

    /**
     * Get the dashboard container, re-creating it if a prior render removed it.
     * renderDashboard() replaces the container's contents, so this just has to
     * guarantee the element exists.
     */
    function ensureContainer() {
      let el = document.getElementById('cx-dashboard');
      if (!el) {
        el = document.createElement('div');
        el.id = 'cx-dashboard';
        document.body.appendChild(el);
      }
      return el;
    }

    /**
     * Render a dashboard spec into the container. Closes any previous instance
     * first (its live-source streams, if any) and empties the container so a
     * re-render does not stack two grids. The spec carries its data inline, so no
     * network fetch is needed; renderDashboard validates it and throws on an
     * invalid spec, which we surface in the error banner.
     */
    function renderDashboardSpec(spec) {
      try {
        if (handle && typeof handle.close === 'function') {
          try { handle.close(); } catch (e) { /* ignore */ }
        }
        handle = null;
        const el = ensureContainer();
        el.innerHTML = '';

        if (typeof CanvasXpressDashboards === 'undefined' ||
            typeof CanvasXpressDashboards.renderDashboard !== 'function') {
          showError('canvasxpress-dashboards bundle did not load.');
          return;
        }
        handle = CanvasXpressDashboards.renderDashboard(spec, 'cx-dashboard');
        lastSpec = spec;
        setTimeout(matchChromeToDashboard, 50); setTimeout(matchChromeToDashboard, 800);
        lastWidth = window.innerWidth || document.documentElement.clientWidth || 0;
        clearError();
        initResizeHandling();
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    /**
     * Re-fit the dashboard when the host resizes the panel. The grid layout is
     * responsive by CSS, so only a WIDTH change (which re-flows the columns and
     * the charts' pixel sizes) warrants a re-render; height changes are just the
     * dashboard's own content growing and need no action. Re-rendering resets
     * per-panel selections, so it is deliberately limited to real width changes.
     */
    function refitToViewport() {
      const w = window.innerWidth || document.documentElement.clientWidth || 0;
      if (!lastSpec || w === lastWidth || w === 0) return;
      renderDashboardSpec(lastSpec);
    }

    let resizeBound = false;
    /** Debounced resize handling, bound once. */
    function initResizeHandling() {
      if (resizeBound) return;
      resizeBound = true;
      function schedule() {
        if (resizeTimer !== null) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () { resizeTimer = null; refitToViewport(); }, 150);
      }
      window.addEventListener('resize', schedule);
    }

    /**
     * Send a JSON-RPC request to the host via postMessage.
     * Per spec §Transport Layer: use '*' as the target origin.
     */
    function sendRequest(method, params) {
      const id = nextId++;
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      return new Promise((resolve, reject) => {
        function listener(event) {
          const msg = event.data;
          if (msg && msg.id === id) {
            window.removeEventListener('message', listener);
            if (msg.result !== undefined) resolve(msg.result);
            else if (msg.error) reject(new Error(JSON.stringify(msg.error)));
            else reject(new Error('Unexpected response: ' + JSON.stringify(msg)));
          }
        }
        window.addEventListener('message', listener);
      });
    }

    /**
     * The toolbar and page take the dashboard's own background (and a readable text colour), so
     * the Save / Open in Builder buttons are visible whether the dashboard resolved to its light
     * or dark theme, whatever colour scheme the host reports to the iframe.
     */
    function parseRgb(css) {
      const m = /rgba?\(([^)]+)\)/.exec(css || '');
      if (!m) return null;
      const p = m[1].split(',').map(function (t) { return parseFloat(t); });
      return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
    }

    function matchChromeToDashboard() {
      const host = document.getElementById('cx-dashboard');
      if (!host) return;
      let node = host.querySelector('.cxd-grid') || host;
      let color = null;
      while (node && node !== document.documentElement) {
        const c = parseRgb(getComputedStyle(node).backgroundColor);
        if (c && c.a > 0.5) { color = c; break; }
        node = node.parentElement;
      }
      if (!color) return;
      const luminance = (0.299 * color.r + 0.587 * color.g + 0.114 * color.b) / 255;
      const root = document.documentElement.style;
      root.setProperty('--cx-chrome-bg', 'rgb(' + color.r + ',' + color.g + ',' + color.b + ')');
      root.setProperty('--cx-chrome-fg', luminance < 0.5 ? '#e5e7eb' : '#111827');
    }

    /**
     * Tell the host how tall the view is (ui/notifications/size-changed). A host sizes the iframe
     * from this; without it the dashboard is clipped to a short default height.
     */
    let lastReportedHeight = 0;
    function reportSize() {
      // Measure the content itself. scrollHeight never drops below the iframe's current height,
      // so a view that failed (nothing drawn) would keep the host's large default blank area.
      let bottom = 0;
      Array.prototype.forEach.call(document.body.children, function (el) {
        const box = el.getBoundingClientRect();
        if (el.id === 'cx-drop' && !el.classList.contains('on')) return;
        if (el.id === 'cx-error' || el.id === 'cx-build') {
          // fixed-position banner/stamp: count only the banner, and only while it shows
          if (el.id === 'cx-error' && getComputedStyle(el).display !== 'none') bottom = Math.max(bottom, box.bottom);
          return;
        }
        if (box.height > 0) bottom = Math.max(bottom, box.bottom + (window.pageYOffset || 0));
      });
      const height = Math.ceil(Math.max(bottom, 18));  // 18px keeps the build stamp visible
      const width = Math.ceil(window.innerWidth || document.documentElement.clientWidth || 0);
      if (!height || Math.abs(height - lastReportedHeight) < 2) return;
      lastReportedHeight = height;
      window.parent.postMessage(
        { jsonrpc: '2.0', method: 'ui/notifications/size-changed', params: { width: width, height: height } }, '*');
    }

    let sizeTimer = null;
    function watchSize() {
      const schedule = function () {
        if (sizeTimer !== null) clearTimeout(sizeTimer);
        sizeTimer = setTimeout(function () { sizeTimer = null; reportSize(); }, 80);
      };
      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(schedule).observe(document.body);
      }
      new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
      schedule();
    }

    /**
     * Save + Open in Builder. Save publishes the spec to the configured dashboards install
     * (the server's publish_canvasxpress_dashboard tool, called through the host). Open in
     * Builder opens the saved dashboard there; when no install is configured it opens the Builder
     * at canvasxpress.org instead (that site cannot receive an unsaved spec).
     */
    let currentPayload = null;   // the last tool result (spec + builder_url)
    let saved = null;            // the publish result once the spec was saved

    function setStatus(text, isError) {
      const el = document.getElementById('cx-status');
      el.textContent = text || '';
      el.className = isError ? 'err' : '';
    }

    function setBusy(busy) {
      document.getElementById('cx-save').disabled = busy;
      document.getElementById('cx-builder').disabled = busy;
    }

    /** Publish the spec; resolves to the server's result ({published, builder_url, errors}). */
    function publishSpec() {
      return sendRequest('tools/call', {
        name: 'publish_canvasxpress_dashboard',
        arguments: { spec: currentPayload.spec },
      }).then(function (result) {
        const block = result && result.content && result.content.find(function (c) { return c.type === 'text'; });
        let out = null;
        try { out = JSON.parse(block.text); } catch (e) { /* fall through */ }
        if (!out) throw new Error((result && result.isError) ? 'the save tool returned an error' : 'unreadable save result');
        return out;
      });
    }

    function publishWithStatus() {
      if (!currentPayload) return Promise.resolve(null);
      setBusy(true);
      setStatus('Saving...');
      return publishSpec().then(function (out) {
        if (out.published) {
          saved = out;
          setStatus('Saved (' + out.id + ')');
        } else {
          setStatus('Not saved: ' + ((out.errors || ['unknown error']).join('; ')), true);
        }
        return out;
      }, function (err) {
        setStatus('Not saved: ' + (err.message || err), true);
        return null;
      }).then(function (out) { setBusy(false); return out; });
    }

    /**
     * Save = download the dashboard spec as JSON to the user's machine (nothing is sent to a
     * server). The sandboxed iframe cannot download directly, so the host is asked through
     * ui/download-file (MCP Apps draft); if the host lacks it or refuses, the JSON is shown in a
     * box with a Copy button, so the spec can always be kept and loaded into any dashboards server.
     */
    function withTimeout(promise, ms) {
      return new Promise(function (resolve, reject) {
        const timer = setTimeout(function () { reject(new Error('the host did not answer')); }, ms);
        promise.then(function (v) { clearTimeout(timer); resolve(v); },
                     function (e) { clearTimeout(timer); reject(e); });
      });
    }

    function showJsonPanel(text, note) {
      const box = document.getElementById('cx-json');
      const area = document.getElementById('cx-json-text');
      area.value = text;
      document.getElementById('cx-json-note').textContent = note || '';
      box.style.display = 'block';
      area.focus();
      area.select();
      document.getElementById('cx-json-close').onclick = function () { box.style.display = 'none'; };
      document.getElementById('cx-json-copy').onclick = function () {
        area.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
        const done = function (good) {
          document.getElementById('cx-json-note').textContent = good ? 'Copied.' : 'Select all and copy (Ctrl/Cmd+C).';
        };
        if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        } else {
          done(ok);
        }
      };
    }

    function downloadSpec() {
      if (!currentPayload || !currentPayload.spec) return;
      const spec = currentPayload.spec;
      const filename = String(spec.id || 'dashboard').replace(/[^A-Za-z0-9._-]+/g, '-') + '.spec.json';
      const text = JSON.stringify(spec, null, 2);
      setStatus('Saving ' + filename + '...');
      withTimeout(sendRequest('ui/download-file', {
        contents: [{ type: 'resource', resource: { uri: 'file:///' + filename, mimeType: 'application/json', text: text } }],
      }), 4000).then(function () {
        setStatus('Saved ' + filename);
      }, function (err) {
        console.warn('[cx-dashboard-view] ui/download-file failed:', err);
        setStatus('Download not available here. Copy the JSON below.', false);
        showJsonPanel(text, filename);
      });
    }

    function openLink(url) {
      return sendRequest('ui/open-link', { url: url }).catch(function () { window.open(url, '_blank'); });
    }

    function openInBuilder() {
      if (!currentPayload) return;
      const fallback = currentPayload.builder_url_public || currentPayload.builder_url;
      const target = saved ? Promise.resolve(saved) : publishWithStatus();
      target.then(function (out) {
        if (out && out.published) {
          openLink(out.builder_url);
        } else if (fallback) {
          // Nothing configured to save into: open the Builder itself.
          openLink(fallback);
          setStatus('Opened the Builder. Saving needs a configured dashboards server.', false);
        }
      });
    }

    /** The inline table of a dashboard spec ({y, x}), or null. */
    function sampleData(spec) {
      const src = spec && spec.data && spec.data.data;
      const value = src && src.kind === 'inline' ? src.value : null;
      return value && value.y && Array.isArray(value.y.vars) && Array.isArray(value.y.smps) ? value : null;
    }

    function fmt(n) { return Number(n).toLocaleString('en-US'); }

    // ------------------------------------------------------------------------------------------
    // Insights: what stands out in the COMPLETE data, computed here (never from a sample).
    //   - declared limits (spec.insights.thresholds): how many rows break each
    //   - a group whose average is far from the overall average: |effect| >= 0.5 SD, z >= 4, >= 5 rows
    //   - values more than 3.5 SD from the mean
    // ------------------------------------------------------------------------------------------
    const ACRONYMS = { gc: 1, os: 1, pfs: 1, dfs: 1, efs: 1, bmi: 1, id: 1, dna: 1, rna: 1, qc: 1, umi: 1, snp: 1, tpm: 1, cpm: 1, fpkm: 1 };

    /** A column name as a reader would write it (same rules as the server): total_reads -> Total Reads. */
    function humanize(name) {
      const text = String(name).replace(/([a-z0-9])([A-Z])/g, '$1 $2');
      const words = text.split(/[\s._\-]+/).filter(Boolean).map(function (token) {
        const low = token.toLowerCase();
        if (low === 'pct' || low === 'percent' || low === 'perc') return '%';
        if ((token === token.toUpperCase() && token !== low) || ACRONYMS[low]) return token.toUpperCase();
        return token.charAt(0).toUpperCase() + token.slice(1);
      });
      return words.join(' ') || String(name);
    }

    function fmtNum(v) {
      const a = Math.abs(v);
      if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e8 ? 0 : 1).replace(/\.0$/, '') + 'M';
      if (a >= 1e4) return Math.round(v).toLocaleString('en-US');
      return String(Number(v.toPrecision(3)));
    }

    const OPS = {
      lt: function (a, b) { return a < b; }, le: function (a, b) { return a <= b; },
      gt: function (a, b) { return a > b; }, ge: function (a, b) { return a >= b; },
    };

    function findMeasure(vars, field) {
      const want = String(field).toLowerCase();
      let hit = vars.filter(function (v) { return String(v).toLowerCase() === want; });
      if (!hit.length) hit = vars.filter(function (v) { return String(v).toLowerCase().indexOf(want) !== -1; });
      return hit.length === 1 ? hit[0] : null;
    }

    /** The captions for a data object ({y:{vars,smps,data}, x}); an array of {rank, text}, best first. */
    function computeInsights(data, thresholds, derived) {
      if (!data || !data.y || !Array.isArray(data.y.vars) || data.y.vars.length > data.y.smps.length) return [];
      const skip = {};
      (derived || []).forEach(function (d) { skip[d.name] = true; });
      const N = data.y.smps.length;
      const vars = data.y.vars.filter(function (v) { return !skip[v]; });
      const column = function (name) { return data.y.data[data.y.vars.indexOf(name)] || []; };
      const factors = Object.keys(data.x || {}).filter(function (k) {
        if (skip[k]) return false;
        const seen = {}; let n = 0;
        data.x[k].forEach(function (v) { if (!seen[v]) { seen[v] = 1; n++; } });
        return n >= 2 && n <= 12 && n < N;
      });
      const found = [];

      (thresholds || []).forEach(function (t) {
        const name = t && findMeasure(vars, t.field);
        if (!name || !OPS[t.op]) return;
        const values = column(name).filter(function (v) { return typeof v === 'number'; });
        const hits = values.filter(function (v) { return OPS[t.op](v, t.value); }).length;
        const label = t.label || (humanize(name) + ' ' + t.op + ' ' + t.value);
        found.push({ rank: 1000, text: label + ': ' + (hits ? fmt(hits) + ' of ' + fmt(values.length) + ' rows (' +
          (100 * hits / values.length).toFixed(1).replace(/\.0$/, '') + '%)' : 'none of ' + fmt(values.length) + ' rows') });
      });

      const groupHits = [];
      const outlierHits = [];
      vars.forEach(function (name) {
        const col = column(name);
        const present = col.filter(function (v) { return typeof v === 'number'; });
        if (present.length < 20) return;
        const mean = present.reduce(function (a, b) { return a + b; }, 0) / present.length;
        const sd = Math.sqrt(present.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / present.length);
        if (!(sd > 0)) return;
        factors.forEach(function (f) {
          const groups = {};
          col.forEach(function (v, i) {
            if (typeof v !== 'number') return;
            const level = data.x[f][i];
            if (level === 'NA') return;
            (groups[level] = groups[level] || { sum: 0, n: 0 });
            groups[level].sum += v; groups[level].n += 1;
          });
          Object.keys(groups).forEach(function (level) {
            const g = groups[level];
            if (g.n < 5) return;
            const diff = g.sum / g.n - mean;
            const effect = diff / sd;
            const z = diff / (sd / Math.sqrt(g.n));
            if (Math.abs(effect) >= 0.5 && Math.abs(z) >= 4) {
              groupHits.push({ rank: Math.abs(effect), key: f + '\u0000' + level, text: humanize(f) + ' ' + level + ': ' +
                humanize(name) + ' averages ' + fmtNum(g.sum / g.n) + ', ' + fmtNum(Math.abs(diff)) + ' ' +
                (diff < 0 ? 'below' : 'above') + ' the overall ' + fmtNum(mean) + ' (' + fmt(g.n) + ' of ' + fmt(N) + ' rows).' });
            }
          });
        });
        if (present.length >= 30) {
          const high = present.filter(function (v) { return v > mean + 3.5 * sd; }).length;
          const low = present.filter(function (v) { return v < mean - 3.5 * sd; }).length;
          [[high, 'above ' + fmtNum(mean + 3.5 * sd)], [low, 'below ' + fmtNum(mean - 3.5 * sd)]].forEach(function (side) {
            if (side[0] > 0 && side[0] <= 0.05 * present.length) {
              outlierHits.push({ rank: side[0], text: fmt(side[0]) + (side[0] === 1 ? ' row has ' : ' rows have ') +
                humanize(name) + ' ' + side[1] + ' (more than 3.5 SD from the mean ' + fmtNum(mean) + ').' });
            }
          });
        }
      });
      groupHits.sort(function (a, b) { return b.rank - a.rank; });
      const perGroup = {};
      groupHits.forEach(function (h) {
        perGroup[h.key] = (perGroup[h.key] || 0) + 1;
        if (perGroup[h.key] <= 2 && found.filter(function (x) { return x.rank < 1000; }).length < 3) found.push(h);
      });
      outlierHits.sort(function (a, b) { return b.rank - a.rank; });
      outlierHits.slice(0, 2).forEach(function (h) { found.push(h); });
      return found.slice(0, 5);
    }

    function hideInsights() {
      const box = document.getElementById('cx-insights');
      box.className = ''; box.textContent = '';
    }

    /** Draw the insights strip for the dashboard now on screen (complete data only). */
    function refreshInsights() {
      const box = document.getElementById('cx-insights');
      const spec = currentPayload && currentPayload.spec;
      const data = sampleData(spec);
      if (!data) { hideInsights(); return; }
      let captions = [];
      try {
        // Columns looked up from another file are the same for every row of a group: not a finding.
        const lookups = ((currentPayload.joined && currentPayload.joined.lookup_columns) || []).map(function (n) { return { name: n }; });
        captions = computeInsights(data, spec.insights && spec.insights.thresholds, (currentPayload.derived || []).concat(lookups));
      } catch (e) { console.warn('[cx-dashboard-view] insights failed:', e); }
      if (!captions.length) { hideInsights(); return; }
      box.textContent = '';
      const title = document.createElement('div');
      title.className = 'ttl';
      title.textContent = 'What stands out';
      const note = document.createElement('span');
      note.textContent = 'computed from all ' + fmt(data.y.smps.length) + ' rows';
      title.appendChild(note);
      const list = document.createElement('ul');
      captions.forEach(function (c) { const li = document.createElement('li'); li.textContent = c.text; list.appendChild(li); });
      box.appendChild(title); box.appendChild(list);
      box.className = 'on';
      if (typeof reportSize === 'function') setTimeout(reportSize, 30);
    }

    function showToolbar(payload) {
      currentPayload = payload;
      saved = null;
      setStatus('');
      document.getElementById('cx-save').onclick = downloadSpec;
      document.getElementById('cx-builder').onclick = openInBuilder;
      document.getElementById('cx-toolbar').style.display = 'flex';
    }

    /**
     * Parse the tool result and extract the dashboard spec.
     * Per spec §Notifications (Host → View): ui/notifications/tool-result params
     * is a CallToolResult: { content: Array<{type, text?}>, isError?: boolean }.
     * The compose/suggest tools return a wrapper { spec, valid, errors, usage, ... };
     * suggest may return { suggested: false, reason } when nothing fits.
     */
    function handleToolResult(params) {
      try {
        const result = params;  // params IS the CallToolResult
        if (result.isError) {
          skipResult('Tool returned an error: ' +
            ((result.content && result.content[0] && result.content[0].text) || 'unknown'));
          return;
        }
        if (!result.content || !result.content.length) {
          skipResult('Tool result has no content');
          return;
        }
        const textBlock = result.content.find(c => c.type === 'text' && c.text);
        if (!textBlock) {
          skipResult('No text content block in tool result');
          return;
        }
        let payload;
        try {
          payload = JSON.parse(textBlock.text);
        } catch (e) {
          // The host replaced the result with something else (it caps the size of a tool result):
          // say so on screen, and recover the id of a held result from the text if it is there.
          const m = /"result_id"\s*:\s*"([A-Za-z0-9_-]+)"/.exec(textBlock.text);
          if (m) { fetchHeldResult(m[1], 0).then(showPayload, function (err) { showError(err.message || String(err)); }); return; }
          showError('The host did not pass the dashboard result on to the view (it was replaced by: "' +
            String(textBlock.text).slice(0, 160) + '...").');
          return;
        }
        if (payload && payload.result_id && !payload.spec) {
          // The short result: the full one (the spec with the complete data) is held on the server.
          const wait = document.getElementById('cx-wait');
          if (wait) wait.textContent = 'Loading the dashboard (' + (payload.parts || 1) + ' parts)...';
          fetchHeldResult(payload.result_id, payload.parts || 1).then(function (full) {
            showPayload(Object.assign({}, payload, full));
          }, function (err) { showError('Could not fetch the dashboard from the server: ' + (err.message || err)); });
          return;
        }
        showPayload(payload);
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    /** Fetch a held result in pieces through the host (tools/call) and parse it. */
    function fetchHeldResult(resultId, parts) {
      const pieces = [];
      function one(part) {
        return sendRequest('tools/call', {
          name: 'get_canvasxpress_dashboard_result', arguments: { result_id: resultId, part: part },
        }).then(function (result) {
          const block = result && result.content && result.content.find(function (c) { return c.type === 'text'; });
          let out = null;
          try { out = JSON.parse(block.text); } catch (e) { /* fall through */ }
          if (!out || out.error) throw new Error((out && out.error) || 'unreadable piece ' + part);
          pieces.push(out.text);
          const total = out.parts || parts || 1;
          const wait = document.getElementById('cx-wait');
          if (wait) wait.textContent = 'Loading the dashboard (' + (part + 1) + ' of ' + total + ' parts)...';
          return part + 1 < total ? one(part + 1) : JSON.parse(pieces.join(''));
        });
      }
      return one(0);
    }

    /**
     * The drop zone: the tool was called with no data, so the person drags the file in here. The
     * view reads the file and sends it to the server in pieces THROUGH THE HOST (tools/call
     * upload_canvasxpress_file), the one channel a host is known to allow the view (the iframe
     * itself may not fetch: Claude Desktop blocks that). The server returns a link; the view calls
     * suggest_canvasxpress_dashboard(url=...) the same way and draws the result. No rows ever pass
     * through the model; a file on the computer, attached to the chat, or made by an analysis all
     * take this path.
     */
    const UPLOAD_PIECE = 60000;   // characters per piece: the size the held-result fetch already uses

    function showDropZone(payload) {
      clearError();
      // match the host's scheme: the dark/light hint it gave at ui/initialize, else the OS setting
      const dark = hostColorScheme ? hostColorScheme === 'dark'
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.body.classList.toggle('cx-dark', !!dark);
      const wait = document.getElementById('cx-wait'); if (wait) wait.remove();
      const zone = document.getElementById('cx-drop');
      zone.classList.add('on');
      zone.classList.remove('busy');
      document.getElementById('cx-drop-note').textContent =
        'Drop 2 to 6 related files together to build one dashboard from all of them.';
    }

    function dropNote(text) { document.getElementById('cx-drop-note').textContent = text; }

    function readText(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () { resolve(String(reader.result || '')); };
        reader.onerror = function () { reject(new Error('could not read ' + file.name)); };
        reader.readAsText(file);
      });
    }

    function callTool(name, args) {
      return sendRequest('tools/call', { name: name, arguments: args }).then(function (result) {
        const block = result && result.content && result.content.find(function (c) { return c.type === 'text'; });
        let out = null;
        try { out = JSON.parse(block.text); } catch (e) { /* fall through */ }
        if (!out) throw new Error((result && result.isError) ? name + ' returned an error' : 'unreadable result from ' + name);
        if (out.error) throw new Error(out.error);
        return out;
      });
    }

    function uploadOne(file) {
      return readText(file).then(function (text) {
        const parts = Math.max(1, Math.ceil(text.length / UPLOAD_PIECE));
        let uploadId = null;
        function piece(part) {
          const args = { name: file.name, text: text.slice(part * UPLOAD_PIECE, (part + 1) * UPLOAD_PIECE), part: part, parts: parts };
          if (uploadId) args.upload_id = uploadId;
          return callTool('upload_canvasxpress_file', args).then(function (out) {
            if (parts > 1) dropNote('Sending ' + file.name + ' (' + (part + 1) + ' of ' + parts + ')...');
            if (out.url) return out;
            uploadId = out.upload_id;
            return piece(part + 1);
          });
        }
        return piece(0);
      });
    }

    function dropFiles(files) {
      files = Array.prototype.slice.call(files || []).filter(function (f) { return f && f.size > 0; });
      if (!files.length) return;
      const zone = document.getElementById('cx-drop');
      if (zone.classList.contains('busy')) return;
      zone.classList.add('busy');
      dropNote('Sending ' + files.map(function (f) { return f.name; }).join(', ') + '...');
      files.reduce(function (chain, f) {        // one file at a time, so the pieces stay in order
        return chain.then(function (ups) { return uploadOne(f).then(function (u) { ups.push(u); return ups; }); });
      }, Promise.resolve([])).then(function (ups) {
        dropNote('Building the dashboard from ' + ups.reduce(function (n, u) { return n + (u.rows || 0); }, 0) + ' rows...');
        const args = ups.length === 1 ? { url: ups[0].url } : { urls: ups.map(function (u) { return u.url; }) };
        return sendRequest('tools/call', { name: 'suggest_canvasxpress_dashboard', arguments: args });
      }).then(function (result) {
        zone.classList.remove('on', 'busy');
        handleToolResult(result);
      }).catch(function (err) {
        zone.classList.remove('busy');
        dropNote('That did not work: ' + (err.message || err) + '. Drop the file again.');
      });
    }

    (function wireDropZone() {
      const zone = document.getElementById('cx-drop');
      const input = document.getElementById('cx-drop-input');
      zone.addEventListener('click', function () { input.click(); });
      zone.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') input.click(); });
      input.addEventListener('change', function () { dropFiles(input.files); input.value = ''; });
      ['dragenter', 'dragover'].forEach(function (t) {
        zone.addEventListener(t, function (e) { e.preventDefault(); zone.classList.add('over'); });
      });
      ['dragleave', 'drop'].forEach(function (t) {
        zone.addEventListener(t, function (e) { e.preventDefault(); zone.classList.remove('over'); });
      });
      zone.addEventListener('drop', function (e) { dropFiles(e.dataTransfer && e.dataTransfer.files); });
      // a file dropped anywhere on the view while the zone shows counts too
      document.addEventListener('dragover', function (e) { if (zone.classList.contains('on')) e.preventDefault(); });
      document.addEventListener('drop', function (e) {
        if (!zone.classList.contains('on') || zone.contains(e.target)) return;
        e.preventDefault(); dropFiles(e.dataTransfer && e.dataTransfer.files);
      });
    })();

    /** Draw a complete result (the wrapper with its spec, or a bare spec). */
    function showPayload(payload) {
      try {
        if (payload && payload.drop) { showDropZone(payload); return; }
        // suggest_canvasxpress_dashboard can decline when no template fits.
        if (payload && payload.suggested === false) {
          skipResult('No dashboard was suggested: ' +
            (payload.reason || 'the data did not match a known template.'));
          return;
        }
        // Accept the wrapper's `spec`, or a bare spec (has layout + panels).
        const spec = (payload && payload.spec) ? payload.spec
          : (payload && payload.layout && payload.panels ? payload : null);
        if (!spec) {
          skipResult('Tool result has no dashboard spec (missing layout/panels).');
          return;
        }
        if (payload && payload.valid === false && Array.isArray(payload.errors) && payload.errors.length) {
          // The server flagged it invalid; renderDashboard would throw anyway.
          skipResult('Dashboard spec is invalid:\n  - ' + payload.errors.join('\n  - '));
          return;
        }
        if (payload && payload.sample) {
          // A sample is never drawn. (The server no longer returns one; this guards an older server.)
          showError('This dashboard was designed from a sample of the table, and it is never drawn from a sample. ' +
            'Ask for it again with every row of the table.');
          return;
        }
        renderDashboardSpec(spec);
        const wait = document.getElementById('cx-wait'); if (wait) wait.remove();
        if (payload && payload.spec) showToolbar(payload);
        refreshInsights();
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    /**
     * Listen for host notifications.
     * Per spec §Notifications (Host → View):
     *   - ui/notifications/tool-result  → render the dashboard
     *   - ui/notifications/tool-input   → clear any previous error (loading)
     */
    window.addEventListener('message', function (event) {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.method === 'ui/notifications/tool-result') {
        handleToolResult(msg.params);
      } else if (msg.method === 'ui/notifications/tool-input') {
        clearError();
      }
      // initialize response etc. handled by sendRequest()
    });

    /**
     * On load: send ui/initialize to the host.
     * Per spec §Lifecycle: the host replies with McpUiInitializeResult, then THE VIEW sends
     * ui/notifications/initialized. The host MUST NOT send tool-input / tool-result before it
     * has received that notification, so without it nothing is ever rendered.
     */
    document.addEventListener('DOMContentLoaded', function () {
      sendRequest('ui/initialize', {
        // Only inline is declared: the dashboard is sized to the iframe width and
        // scrolls vertically; modal/fullscreen would need extra layout logic.
        appCapabilities: { availableDisplayModes: ['inline'] },
        appInfo: { name: 'canvasxpress-dashboard-view', version: '1.0.0' },
        clientInfo: { name: 'canvasxpress-dashboard-view', version: '1.0.0' },
        protocolVersion: '2026-01-26',
      }).then(function (init) {
        // McpUiInitializeResult.hostContext.theme is the host's colour scheme when it reports one
        const ctx = (init && init.hostContext) || {};
        hostColorScheme = ctx.theme === 'dark' || ctx.theme === 'light' ? ctx.theme : null;
        window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} }, '*');
        watchSize();
        const wait = document.getElementById('cx-wait');
        if (wait) wait.textContent = 'Connected to the host. Waiting for the dashboard...';
      }).catch(function (err) {
        // Host may not support MCP Apps; the dashboard still renders if a
        // tool-result postMessage arrives.
        console.warn('[cx-dashboard-view] ui/initialize failed (host may not support MCP Apps):', err);
        const wait = document.getElementById('cx-wait');
        if (wait) wait.textContent = 'The host did not answer ui/initialize: ' + (err.message || err);
      });
    });
  </script>
</body>
</html>
