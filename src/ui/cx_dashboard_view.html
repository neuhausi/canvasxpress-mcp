<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanvasXpress Dashboard View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    /* A dashboard is a grid of panels that can be taller than the iframe, so
       (unlike the single-chart view) the body scrolls rather than clipping. */
    body {
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--cxd-bg, #ffffff);
      color: var(--cxd-fg, #111827);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #cx-dashboard { width: 100%; }
    /* Compact filter search boxes (the bundle's default is a 32px field). */
    .cxd-filters input.cX-DataFilter-Search { height: 24px; font-size: 12px; padding: 0 0 0 6px; margin-bottom: 3px; }
    .cxd-filters input.cxd-filters-find { margin-bottom: 6px; }
    .cxv-resize {
      position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; z-index: 10000;
      cursor: nwse-resize; touch-action: none; opacity: .45;
      background: linear-gradient(135deg, transparent 50%, currentColor 50%, currentColor 58%,
        transparent 58%, transparent 72%, currentColor 72%, currentColor 80%, transparent 80%);
    }
    .cxv-drag {
      position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; z-index: 10000;
      cursor: grab; touch-action: none; opacity: .45; border-radius: 4px;
      background: radial-gradient(currentColor 1.6px, transparent 2px) 0 0 / 7px 7px;
    }
    .cxv-drag:active { cursor: grabbing; }
    .cxv-drag:hover, .cxv-resize:hover, .cxv-resizing .cxv-resize, .cxv-resizing .cxv-drag { opacity: 1; }
    #cx-toolbar { display: none; justify-content: flex-end; padding: 4px 8px 0; }
    #cx-builder {
      font-size: 12px; color: inherit; opacity: .75; text-decoration: none;
      border: 1px solid currentColor; border-radius: 4px; padding: 2px 8px; cursor: pointer;
    }
    #cx-builder:hover { opacity: 1; }
    #cx-error {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #fee2e2;
      color: #b91c1c;
      font-family: monospace;
      font-size: 13px;
      padding: 12px 16px;
      border-bottom: 1px solid #fca5a5;
      z-index: 9999;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
  <!--
    The canonical canvasxpress-dashboards drop-in: the CanvasXpress engine CSS +
    JS, then the dashboards UMD bundle. Both are served from
    https://www.canvasxpress.org, so a single origin covers the MCP Apps CSP
    (resourceDomains). The dashboards global is `CanvasXpressDashboards`; it needs
    the `CanvasXpress` global, hence the load order.
    Per MCP Apps spec §UI Resource Format: resourceDomains must include
    "https://www.canvasxpress.org" when the host enforces CSP.
  -->
  <link href="https://www.canvasxpress.org/dist/canvasXpress.css" rel="stylesheet" />
  <script src="https://www.canvasxpress.org/dist/canvasXpress.min.js"></script>
  <script src="https://www.canvasxpress.org/dashboards/canvasxpress-dashboards.umd.js"></script>
</head>
<body>
  <div id="cx-error"></div>
  <div id="cx-toolbar"><a id="cx-builder" href="#" role="button">Open in Builder</a></div>
  <div id="cx-dashboard"></div>

  <script>
    // ---------------------------------------------------------------------------
    // MCP Apps protocol implementation (dashboard view).
    // Per MCP Apps spec §Communication Protocol (2026-01-26):
    //   - View sends ui/initialize request to window.parent via postMessage
    //   - Host sends ui/notifications/tool-result notification with CallToolResult
    //   - Spec §Transport Layer: postMessage target origin is '*'
    // Modelled on cx_chart_view.html; the difference is that the payload carries a
    // full dashboard `spec` rendered with CanvasXpressDashboards.renderDashboard()
    // (a grid of linked panels) instead of a single {data, config} chart.
    // ---------------------------------------------------------------------------

    let handle = null;         // { close } from renderDashboard (live-source teardown)
    let lastSpec = null;       // last spec drawn, for a resize re-render
    let lastWidth = 0;         // last viewport width a render was done at
    let resizeTimer = null;
    let nextId = 1;

    /** Show a visible error banner (not just console.error). */
    function showError(msg) {
      const el = document.getElementById('cx-error');
      el.textContent = 'CanvasXpress Dashboards error: ' + msg;
      el.style.display = 'block';
      console.error('[cx-dashboard-view]', msg);
    }

    /** Clear a prior error banner. */
    function clearError() {
      const el = document.getElementById('cx-error');
      if (el) el.style.display = 'none';
    }

    /**
     * Get the dashboard container, re-creating it if a prior render removed it.
     * renderDashboard() replaces the container's contents, so this just has to
     * guarantee the element exists.
     */
    function ensureContainer() {
      let el = document.getElementById('cx-dashboard');
      if (!el) {
        el = document.createElement('div');
        el.id = 'cx-dashboard';
        document.body.appendChild(el);
      }
      return el;
    }

    /**
     * Render a dashboard spec into the container. Closes any previous instance
     * first (its live-source streams, if any) and empties the container so a
     * re-render does not stack two grids. The spec carries its data inline, so no
     * network fetch is needed; renderDashboard validates it and throws on an
     * invalid spec, which we surface in the error banner.
     */
    function renderDashboardSpec(spec) {
      try {
        if (handle && typeof handle.close === 'function') {
          try { handle.close(); } catch (e) { /* ignore */ }
        }
        handle = null;
        const el = ensureContainer();
        el.innerHTML = '';

        if (typeof CanvasXpressDashboards === 'undefined' ||
            typeof CanvasXpressDashboards.renderDashboard !== 'function') {
          showError('canvasxpress-dashboards bundle did not load.');
          return;
        }
        handle = CanvasXpressDashboards.renderDashboard(spec, 'cx-dashboard');
        lastSpec = spec;
        lastWidth = window.innerWidth || document.documentElement.clientWidth || 0;
        clearError();
        initResizeHandling();
        addResizeHandles();
        if (!panelsWatched) { panelsWatched = true; watchForPanels(); }
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    /**
     * Re-fit the dashboard when the host resizes the panel. The grid layout is
     * responsive by CSS, so only a WIDTH change (which re-flows the columns and
     * the charts' pixel sizes) warrants a re-render; height changes are just the
     * dashboard's own content growing and need no action. Re-rendering resets
     * per-panel selections, so it is deliberately limited to real width changes.
     */
    function refitToViewport() {
      const w = window.innerWidth || document.documentElement.clientWidth || 0;
      if (!lastSpec || w === lastWidth || w === 0) return;
      renderDashboardSpec(lastSpec);
    }

    let panelsWatched = false;
    let resizeBound = false;
    /** Debounced resize handling, bound once. */
    function initResizeHandling() {
      if (resizeBound) return;
      resizeBound = true;
      function schedule() {
        if (resizeTimer !== null) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () { resizeTimer = null; refitToViewport(); }, 150);
      }
      window.addEventListener('resize', schedule);
    }

    /**
     * Send a JSON-RPC request to the host via postMessage.
     * Per spec §Transport Layer: use '*' as the target origin.
     */
    function sendRequest(method, params) {
      const id = nextId++;
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      return new Promise((resolve, reject) => {
        function listener(event) {
          const msg = event.data;
          if (msg && msg.id === id) {
            window.removeEventListener('message', listener);
            if (msg.result !== undefined) resolve(msg.result);
            else if (msg.error) reject(new Error(JSON.stringify(msg.error)));
            else reject(new Error('Unexpected response: ' + JSON.stringify(msg)));
          }
        }
        window.addEventListener('message', listener);
      });
    }

    /**
     * Panel move + resize. Every panel gets a grip (top right, drag to move) and a corner handle
     * (drag to resize). Both snap to the grid; panels that collide are pushed down and the rest
     * float back up, so nothing overlaps. The charts follow through the renderer's resize
     * observers, and the new layout is written to the remembered spec so a width re-render keeps it.
     */
    function readLayout(grid) {
      return Array.prototype.map.call(grid.querySelectorAll(':scope > .cxd-panel'), function (cell, index) {
        const a = cell.style.gridArea.split('/').map(function (t) { return parseInt(t.replace('span', ''), 10); });
        return { cell: cell, index: index, row: a[0], col: a[1], h: a[2], w: a[3] };
      });
    }

    function overlaps(a, b) {
      return a.col < b.col + b.w && b.col < a.col + a.w && a.row < b.row + b.h && b.row < a.row + a.h;
    }

    /** Place `moved` where it is, then every other panel top-down: pushed below what it hits, then lifted. */
    function settleLayout(items, moved) {
      const placed = [moved];
      items.filter(function (it) { return it !== moved; })
        .sort(function (a, b) { return a.row - b.row || a.col - b.col; })
        .forEach(function (it) {
          it.row = 1;
          let hit = true;
          while (hit) {
            hit = placed.find(function (o) { return overlaps(it, o); });
            if (hit) it.row = hit.row + hit.h;
          }
          placed.push(it);
        });
    }

    function applyLayout(grid, items, rowHeight) {
      grid.style.gridAutoRows = rowHeight + 'px';
      const specItems = lastSpec && lastSpec.layout && lastSpec.layout.items;
      items.forEach(function (it) {
        it.cell.style.gridArea = it.row + ' / ' + it.col + ' / span ' + it.h + ' / span ' + it.w;
        if (specItems && specItems[it.index]) {
          specItems[it.index].x = it.col - 1; specItems[it.index].y = it.row - 1;
          specItems[it.index].w = it.w; specItems[it.index].h = it.h;
        }
      });
    }

    function addResizeHandles() {
      const grid = document.querySelector('#cx-dashboard .cxd-grid');
      if (!grid) return;
      grid.querySelectorAll(':scope > .cxd-panel').forEach(function (cell, index) {
        if (cell.querySelector(':scope > .cxv-resize')) return;
        const grip = document.createElement('div');
        grip.className = 'cxv-drag';
        grip.title = 'Drag to move';
        grip.addEventListener('pointerdown', function (e) { startDrag(e, grid, cell, index, grip, 'move'); });
        const handle = document.createElement('div');
        handle.className = 'cxv-resize';
        handle.title = 'Drag to resize';
        handle.addEventListener('pointerdown', function (e) { startDrag(e, grid, cell, index, handle, 'size'); });
        cell.appendChild(grip);
        cell.appendChild(handle);
      });
    }

    function startDrag(e, grid, cell, index, handle, mode) {
      e.preventDefault();
      e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      const style = getComputedStyle(grid);
      const gap = parseFloat(style.columnGap) || 0;
      const rowGap = parseFloat(style.rowGap) || 0;
      const cols = style.gridTemplateColumns.split(' ').length;
      const colStep = (grid.clientWidth - gap * (cols - 1)) / cols + gap;
      const rowHeight = parseFloat(style.gridTemplateRows.split(' ')[0]) || 30;
      const rowStep = rowHeight + rowGap;
      const items = readLayout(grid);
      const moved = items[index];
      const start = { row: moved.row, col: moved.col, w: moved.w, h: moved.h };
      const startX = e.clientX, startY = e.clientY;
      cell.classList.add('cxv-resizing');
      cell.style.zIndex = 20;

      function move(ev) {
        const dCol = Math.round((ev.clientX - startX) / colStep);
        const dRow = Math.round((ev.clientY - startY) / rowStep);
        if (mode === 'move') {
          moved.col = Math.max(1, Math.min(cols - start.w + 1, start.col + dCol));
          moved.row = Math.max(1, start.row + dRow);
        } else {
          moved.w = Math.max(1, Math.min(cols - start.col + 1, start.w + dCol));
          moved.h = Math.max(2, start.h + dRow);
        }
        settleLayout(items, moved);
        applyLayout(grid, items, rowHeight);
      }
      function done() {
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', done);
        handle.removeEventListener('pointercancel', done);
        cell.classList.remove('cxv-resizing');
        cell.style.zIndex = '';
        window.dispatchEvent(new Event('resize'));
      }
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', done);
      handle.addEventListener('pointercancel', done);
    }

    /** Panels draw their contents asynchronously; keep a handle on each cell. */
    let handleTimer = null;
    function watchForPanels() {
      new MutationObserver(function () {
        if (handleTimer !== null) clearTimeout(handleTimer);
        handleTimer = setTimeout(function () { handleTimer = null; addResizeHandles(); }, 100);
      }).observe(document.getElementById('cx-dashboard'), { childList: true, subtree: true });
    }

    /**
     * "Open in Builder": the configured dashboards install, else canvasxpress.org. The host
     * opens the link (ui/open-link); a plain new-tab link is the fallback.
     */
    function showBuilderLink(url) {
      if (!url) return;
      const link = document.getElementById('cx-builder');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.onclick = function (e) {
        e.preventDefault();
        sendRequest('ui/open-link', { url: url }).catch(function () { window.open(url, '_blank'); });
      };
      document.getElementById('cx-toolbar').style.display = 'flex';
    }

    /**
     * Parse the tool result and extract the dashboard spec.
     * Per spec §Notifications (Host → View): ui/notifications/tool-result params
     * is a CallToolResult: { content: Array<{type, text?}>, isError?: boolean }.
     * The compose/suggest tools return a wrapper { spec, valid, errors, usage, ... };
     * suggest may return { suggested: false, reason } when nothing fits.
     */
    function handleToolResult(params) {
      try {
        const result = params;  // params IS the CallToolResult
        if (result.isError) {
          showError('Tool returned an error: ' +
            ((result.content && result.content[0] && result.content[0].text) || 'unknown'));
          return;
        }
        if (!result.content || !result.content.length) {
          showError('Tool result has no content');
          return;
        }
        const textBlock = result.content.find(c => c.type === 'text' && c.text);
        if (!textBlock) {
          showError('No text content block in tool result');
          return;
        }
        let payload;
        try {
          payload = JSON.parse(textBlock.text);
        } catch (e) {
          showError('Failed to parse tool result JSON: ' + e.message);
          return;
        }
        // suggest_canvasxpress_dashboard can decline when no template fits.
        if (payload && payload.suggested === false) {
          showError('No dashboard was suggested: ' +
            (payload.reason || 'the data did not match a known template.'));
          return;
        }
        // Accept the wrapper's `spec`, or a bare spec (has layout + panels).
        const spec = (payload && payload.spec) ? payload.spec
          : (payload && payload.layout && payload.panels ? payload : null);
        if (!spec) {
          showError('Tool result has no dashboard spec (missing layout/panels).');
          return;
        }
        if (payload && payload.valid === false && Array.isArray(payload.errors) && payload.errors.length) {
          // The server flagged it invalid; renderDashboard would throw anyway.
          showError('Dashboard spec is invalid:\n  - ' + payload.errors.join('\n  - '));
          return;
        }
        renderDashboardSpec(spec);
        showBuilderLink(payload && payload.builder_url);
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    /**
     * Listen for host notifications.
     * Per spec §Notifications (Host → View):
     *   - ui/notifications/tool-result  → render the dashboard
     *   - ui/notifications/tool-input   → clear any previous error (loading)
     */
    window.addEventListener('message', function (event) {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.method === 'ui/notifications/tool-result') {
        handleToolResult(msg.params);
      } else if (msg.method === 'ui/notifications/tool-input') {
        clearError();
      }
      // initialize response etc. handled by sendRequest()
    });

    /**
     * On load: send ui/initialize to the host.
     * Per spec §Lifecycle: the host replies with McpUiInitializeResult, then sends
     * ui/notifications/initialized, tool-input and tool-result.
     */
    document.addEventListener('DOMContentLoaded', function () {
      sendRequest('ui/initialize', {
        // Only inline is declared: the dashboard is sized to the iframe width and
        // scrolls vertically; modal/fullscreen would need extra layout logic.
        appCapabilities: { availableDisplayModes: ['inline'] },
        clientInfo: { name: 'canvasxpress-dashboard-view', version: '1.0.0' },
        protocolVersion: '2026-01-26',
      }).catch(function (err) {
        // Host may not support MCP Apps; the dashboard still renders if a
        // tool-result postMessage arrives.
        console.warn('[cx-dashboard-view] ui/initialize failed (host may not support MCP Apps):', err);
      });
    });
  </script>
</body>
</html>
